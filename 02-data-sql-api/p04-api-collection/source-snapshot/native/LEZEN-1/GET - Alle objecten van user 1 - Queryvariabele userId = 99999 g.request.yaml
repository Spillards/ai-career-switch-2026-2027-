$kind: http-request
name: GET - Alle objecten van user 1 - Queryvariabele userId = 99999 gebruikt
url: https://jsonplaceholder.typicode.com/posts?userId=99999
method: GET
queryParams:
  userId: "99999"
scripts:
  - type: afterResponse
    code: |-
      pm.test("De server retourneert 200 - Statuscheck", function () {
      pm.response.to.have.status(200);
      });
      pm.test("De geretourneerde post heeft userId 99999 en is leeg", function () {
      const post = pm.response.json();

      pm.expect(post).to.be.an("array").that.is.empty;
      pm.expect(post.every(post => post.userId === 99999)).to.eql(true);
      });
    language: text/javascript
order: 11000
