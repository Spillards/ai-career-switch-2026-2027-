$kind: http-request
url: "{{base_url}}/posts/225"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("De server retourneert 404 - Statuscheck", function () {
        pm.response.to.have.status(404);
      });

      pm.test("De response bevat een leeg object - Inhoudscheck", function () {
        const post = pm.response.json();
        pm.expect(post).to.deep.eql({});
      });
    language: text/javascript
order: 8000
