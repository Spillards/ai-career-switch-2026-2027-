$kind: http-request
url: https://jsonplaceholder.typicode.com/posts/?userId=1
method: GET
queryParams:
  userId: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test("De server retourneert 200 - Statuscheck", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Alle teruggegeven posts hebben userId 1", function () {
        const posts = pm.response.json();

        pm.expect(posts).to.be.an("array").that.is.not.empty;
        pm.expect(posts.every(post => post.userId === 1)).to.eql(true);
      });
    language: text/javascript
order: 5000
